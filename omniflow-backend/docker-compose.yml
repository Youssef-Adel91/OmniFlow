# ════════════════════════════════════════════════════════════════════════════════
# OmniFlow AI — Local Development Infrastructure (Sprint 0)
# Data Plane: PostgreSQL • Redis • Redpanda (Kafka-compat) • Qdrant • ClickHouse
# ════════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down -v        # Stop & remove all volumes
#   docker compose logs -f <svc>  # Tail specific service logs
#
# Redpanda is used instead of full Apache Kafka for local dev (lightweight,
# fully Kafka-compatible, no ZooKeeper required).
#
# ════════════════════════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

networks:
  omniflow-net:
    name: omniflow-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    name: omniflow_postgres_data
  redis_data:
    name: omniflow_redis_data
  redpanda_data:
    name: omniflow_redpanda_data
  qdrant_data:
    name: omniflow_qdrant_data
  clickhouse_data:
    name: omniflow_clickhouse_data
  clickhouse_logs:
    name: omniflow_clickhouse_logs
  pgadmin_data:
    name: omniflow_pgadmin_data

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — Primary OLTP Store (with RLS support)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: omniflow-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniflow_dev_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-omniflow_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ar_SA.UTF-8"
      # Performance tuning for dev (adjust for your RAM)
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_MAX_CONNECTIONS: "200"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro  # SQL init scripts
      - ./infra/postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=768MB
        -c log_min_duration_statement=1000
        -c log_statement=none
        -c wal_level=replica
        -c max_wal_senders=3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniflow} -d ${POSTGRES_DB:-omniflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      omniflow-net:
        ipv4_address: 172.28.0.10

  # ─────────────────────────────────────────────────────────────────────────────
  # PgBouncer — Connection Pooler (transaction mode for RLS)
  # ─────────────────────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: omniflow-pgbouncer
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-omniflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-omniflow_dev_secret_change_me}
      DB_NAME: ${POSTGRES_DB:-omniflow_db}
      POOL_MODE: transaction          # Required for RLS with SET LOCAL
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 5
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-omniflow} -d pgbouncer -c 'SHOW POOLS;' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      omniflow-net:
        ipv4_address: 172.28.0.11

  # ─────────────────────────────────────────────────────────────────────────────
  # PgAdmin 4 — Database GUI (dev only)
  # ─────────────────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: omniflow-pgadmin
    restart: unless-stopped
    profiles: ["tools"]             # Only starts with: docker compose --profile tools up
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@omniflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - omniflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis 7.4 — Conversation Cache, Session State, Rate Limiting, Celery Broker
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: omniflow-redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_secret_change_me}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
        --requirepass ${REDIS_PASSWORD:-redis_dev_secret_change_me}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --loglevel notice
        --save 900 1
        --save 300 10
        --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      omniflow-net:
        ipv4_address: 172.28.0.20

  # ─────────────────────────────────────────────────────────────────────────────
  # Redpanda — Kafka-Compatible Message Broker (lightweight, no ZooKeeper)
  # Replaces full Apache Kafka for local dev. 100% API compatible.
  # Switch to AWS MSK / confluent in staging/prod.
  # ─────────────────────────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: omniflow-redpanda
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${KAFKA_PORT:-9092}:9092"          # Kafka API (for producers/consumers)
      - "${REDPANDA_ADMIN_PORT:-9644}:9644" # Redpanda Admin API
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081" # Schema Registry
      - "${REDPANDA_PROXY_PORT:-8082}:8082"  # Pandaproxy (HTTP REST)
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9093,external://localhost:${KAFKA_PORT:-9092}
      - --schema-registry-addr http://0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 2
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      omniflow-net:
        ipv4_address: 172.28.0.30

  # ─────────────────────────────────────────────────────────────────────────────
  # Redpanda Console — Kafka Topic & Message UI
  # ─────────────────────────────────────────────────────────────────────────────
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: omniflow-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: ["tools"]
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./infra/redpanda/console-config.yaml:/etc/console/config.yaml:ro
    networks:
      - omniflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Qdrant — Vector Database for RAG, Semantic Cache, Vision Embeddings
  # ─────────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: omniflow-qdrant
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${QDRANT_PORT:-6333}:6333"       # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC API (preferred for production)
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_dev_api_key_change_me}
      QDRANT__CLUSTER__ENABLED: "false"   # Single node for dev
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz | grep -q 'ok'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      omniflow-net:
        ipv4_address: 172.28.0.40

  # ─────────────────────────────────────────────────────────────────────────────
  # ClickHouse — Columnar OLAP Database for Analytics & BI
  # ─────────────────────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    container_name: omniflow-clickhouse
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./infra/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-omniflow_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-omniflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev_secret_change_me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=${CLICKHOUSE_USER:-omniflow} --password=${CLICKHOUSE_PASSWORD:-clickhouse_dev_secret_change_me} --query='SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      omniflow-net:
        ipv4_address: 172.28.0.50

  # ─────────────────────────────────────────────────────────────────────────────
  # MinIO — S3-Compatible Object Storage (local dev substitute for AWS S3)
  # Stores: Voice recordings, images, reports, VCard logos
  # ─────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: omniflow-minio
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${MINIO_API_PORT:-9020}:9000"     # S3-compatible API
      - "${MINIO_CONSOLE_PORT:-9021}:9001" # MinIO web console
    volumes:
      - ./infra/minio/data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omniflow_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_change_me}
      MINIO_SITE_NAME: omniflow-local
      MINIO_CONSOLE_ADDRESS: ":9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      omniflow-net:
        ipv4_address: 172.28.0.60

  # ─────────────────────────────────────────────────────────────────────────────
  # MinIO Init — Auto-create buckets on startup
  # ─────────────────────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc
    container_name: omniflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-omniflow_admin} $${MINIO_ROOT_PASSWORD:-minio_dev_secret_change_me};
      mc mb myminio/omniflow-media || true;
      mc anonymous set public myminio/omniflow-media;
      "
    networks:
      - omniflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Flower — Celery Task Monitoring Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  flower:
    image: mher/flower:2.0.1
    container_name: omniflow-flower
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-redis_dev_secret_change_me}@redis:6379/1"
      FLOWER_PORT: 5555
      FLOWER_BASIC_AUTH: "${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower_admin}"
    networks:
      - omniflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus — Metrics Collection
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: omniflow-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - omniflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana — Metrics Visualization
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.1
    container_name: omniflow-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana_admin}
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - omniflow-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Jaeger — Distributed Tracing UI (OpenTelemetry backend)
  # ─────────────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: omniflow-jaeger
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"    # Jaeger UI
      - "4317:4317"                          # OTLP gRPC receiver
      - "4318:4318"                          # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
    networks:
      - omniflow-net
