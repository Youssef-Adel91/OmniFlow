[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniflow-ai-backend"
version = "2.0.0"
description = "OmniFlow AI — Enterprise Real Estate Digital Twin Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "OmniFlow AI Engineering", email = "engineering@omniflow.ai" }]

dependencies = [
  # ─── Core API Framework ────────────────────────────────────────
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "gunicorn>=22.0.0",
  "starlette>=0.41.0",

  # ─── Data Validation & Serialization ──────────────────────────
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "email-validator>=2.2.0",

  # ─── Async PostgreSQL & ORM ────────────────────────────────────
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  # "pgbouncer-sqlalchemy>=0.1.0",    # PgBouncer-aware session management (Incompatible with Python 3.11+)

  # ─── Message Broker (Kafka) ────────────────────────────────────
  "aiokafka>=0.11.0",
  "confluent-kafka>=2.5.0",         # High-perf C bindings alternative

  # ─── Redis / Caching ──────────────────────────────────────────
  "redis[hiredis]>=5.1.0",          # redis.asyncio included
  "coredis>=4.17.0",                # Asyncio-native Redis cluster support

  # ─── Vector Database ──────────────────────────────────────────
  "qdrant-client[fastembed]>=1.12.0",

  # ─── AI / LLM Clients ─────────────────────────────────────────
  # Primary: OpenAI AsyncOpenAI — used by llm_orchestrator.py for all
  # 4-model routing tiers (gpt-4o-mini L1/L2 classifier, gpt-4o L3).
  "openai>=1.54.0",
  # The Kafka LLM worker still uses the Google GenAI client.
  "google-genai>=1.0.0",
  "google-api-core>=2.0.0",
  "anthropic>=0.37.0",              # Claude fallback
  "tiktoken>=0.8.0",                # Token counting

  # ─── Embeddings & ML ──────────────────────────────────────────
  "sentence-transformers>=3.2.0",
  "fastembed>=0.4.0",               # Lightweight embeddings in Rust
  "torch>=2.4.0",                   # For self-hosted Whisper
  "transformers>=4.46.0",
  "openai-whisper>=20240927",       # Self-hosted Whisper-large-v3

  # ─── RAG / Document Processing ────────────────────────────────
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "unstructured[all-docs]>=0.15.0", # Document parsing (PDF, DOCX, etc.)
  "weasyprint>=62.0",               # HTML/CSS -> PDF authoring for customer report generation; verified against 70.0
  "python-docx>=1.1.0",
  "pillow>=10.4.0",                 # Image processing
  "pytesseract>=0.3.13",            # OCR for Arabic documents
  "rank-bm25>=0.2.2",               # BM25 sparse retrieval
  "FlagEmbedding>=1.2.11",          # bge-reranker cross-encoder

  # ─── HTTP Clients ─────────────────────────────────────────────
  "httpx>=0.27.0",
  "aiohttp>=3.10.0",
  "httpx-oauth>=0.15.0",

  # ─── Security & Auth ──────────────────────────────────────────
  "python-jose[cryptography]>=3.3.0",
  "PyJWT[crypto]>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "cryptography>=43.0.0",
  "pyotp>=2.9.0",                   # TOTP for 2FA
  "python-multipart>=0.0.12",       # Form data / file uploads
  "clerk-backend-api>=1.2.0",
  "svix>=1.20.0",

  # ─── Task Scheduling (Celery) ─────────────────────────────────
  "celery[redis]>=5.4.0",
  "celery-redbeat>=2.2.0",          # Redis-based Beat Scheduler
  "flower>=2.0.1",                  # Celery monitoring UI

  # ─── Observability & Monitoring ───────────────────────────────
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "opentelemetry-instrumentation-kafka-python>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "prometheus-client>=0.21.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "structlog>=24.4.0",              # Structured JSON logging

  # ─── Payment Integrations ─────────────────────────────────────
  "moyasar>=0.3.0",                 # Saudi payment gateway
  "requests>=2.32.0",               # Tap.company REST calls

  # ─── Storage (AWS S3) ─────────────────────────────────────────
  "boto3>=1.35.0",
  "aiobotocore>=2.15.0",            # Async S3 operations

  # ─── ClickHouse (OLAP) ────────────────────────────────────────
  "clickhouse-connect>=0.8.0",      # Python ClickHouse driver

  # ─── Utilities ────────────────────────────────────────────────
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",                  # CLI tools
  "rich>=13.9.0",                   # Pretty CLI output
  "orjson>=3.10.0",                 # Fast JSON serialization
  "tenacity>=9.0.0",                # Retry logic
  "cachetools>=5.5.0",
  "python-slugify>=8.0.0",
  "phonenumbers>=8.13.0",           # Saudi phone number parsing
  "vobject>=0.9.6.1",               # VCard 3.0 generation
  "Levenshtein>=0.26.0",            # Fuzzy text matching
  "arabic-reshaper>=3.0.0",         # Arabic text normalization
  "python-bidi>=0.6.0",             # BiDi text handling
  "camel-tools>=1.5.2",             # Arabic NLP (CAMeL)
  "geopy>=2.4.0",                   # Distance calculation
  "pendulum>=3.0.0",                # Advanced datetime with timezone
  "ulid-py>=1.1.0",                 # ULID for event IDs
  "pyarrow>=17.0.0",                # Columnar data (ClickHouse Arrow)
]

[project.optional-dependencies]
dev = [
  # ─── Testing ──────────────────────────────────────────────────
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.6.0",           # Parallel test execution
  "httpx>=0.27.0",                  # ASGI test client
  "factory-boy>=3.3.0",             # Test data factories
  "faker[ar_SA]>=30.0.0",          # Fake Arabic/Saudi data
  "Faker>=30.0.0",

  # ─── Code Quality ─────────────────────────────────────────────
  "ruff>=0.7.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "bandit>=1.8.0",                  # Security linting
  "safety>=3.2.0",                  # Dependency vulnerability scan

  # ─── Dev Tools ────────────────────────────────────────────────
  "ipython>=8.28.0",
  "pre-commit>=4.0.0",
  "watchfiles>=0.24.0",
  "pymupdf>=1.24.0",                # PDF rasterization/extraction for the pdf_builder self-check
  "pdfminer.six>=20231228",         # ToUnicode-CMap-accurate extraction for the pdf_builder self-check
]

gpu = [
  "torch[cuda]>=2.4.0",            # GPU inference for self-hosted Whisper
  "torchaudio>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ─── Ruff (Linter + Formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "UP",       # pyupgrade
  "SIM",      # flake8-simplify
  "TCH",      # flake8-type-checking
  "ASYNC",    # flake8-async
  "S",        # bandit security rules
]
ignore = ["S101", "S104"]  # Allow assert, bind all interfaces in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

# ─── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]

# ─── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=85"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/*/migrations/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
