# docker-compose.prod.yml
# OmniFlow AI Production Deployment
#
# Usage (prefer ./deploy.sh, which wraps all of this):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# With the optional monitoring stack (Prometheus + Grafana + exporters):
#   docker compose --env-file .env.prod \
#     -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# ⚠️ ALWAYS pass --env-file .env.prod. The per-service `env_file:` key only
# injects variables INTO the containers; Compose's own ${VAR} interpolation
# (POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD, ...) reads the shell
# environment or --env-file. Omitting it silently substitutes empty strings.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

# Shared definition for every service built from the backend image.
x-backend-base: &backend-base
  build:
    context: ../omniflow-backend
    dockerfile: Dockerfile
  restart: always
  logging: *default-logging
  env_file: .env.prod
  networks:
    - omniflow-prod-net

networks:
  omniflow-prod-net:
    name: omniflow-prod-net
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  redpanda_prod_data:
  qdrant_prod_data:
  minio_prod_data:

services:
  # ── Data Plane (Backend Storage & Streaming) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: prod-postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ar_SA.UTF-8"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - omniflow-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: prod-pgbouncer
    restart: always
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 100
      AUTH_TYPE: scram-sha-256
    networks:
      - omniflow-prod-net
    healthcheck:
      # The edoburu image is Alpine-based, so busybox `nc` is guaranteed to
      # exist while `pg_isready` may not. If your image ships postgresql-client
      # you can use the stricter check instead:
      #   ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${DB_USER}"]
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: prod-redis
    restart: always
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - omniflow-prod-net
    healthcheck:
      # $$ escapes the variable so Compose leaves it for the container shell.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: prod-redpanda
    restart: always
    logging: *default-logging
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
      - --smp 2
      - --memory 2G
    volumes:
      - redpanda_prod_data:/var/lib/redpanda/data
    networks:
      - omniflow-prod-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy 2>/dev/null || rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: prod-qdrant
    restart: always
    logging: *default-logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_prod_data:/qdrant/storage
    networks:
      - omniflow-prod-net
    healthcheck:
      # The Qdrant image ships neither curl nor wget, so we use a bash TCP
      # probe against the REST port. (`/healthz` would need an HTTP client and,
      # with an API key set, an auth header.)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: prod-minio
    restart: always
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data
    volumes:
      - minio_prod_data:/data
    networks:
      - omniflow-prod-net
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc
    container_name: prod-minio-init
    restart: "no"
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    # SECURITY: the bucket used to be `mc anonymous set public`, which grants
    # anonymous READ *and WRITE* to the whole bucket — anyone could overwrite or
    # delete customer media. It is now locked down:
    #   * bucket root  -> no anonymous access at all (private).
    #   * public/      -> anonymous read-only (`download`), for assets that are
    #                     genuinely meant to be hot-linked (logos, avatars,
    #                     WhatsApp-facing media that must be fetchable by Meta).
    # Everything else must be served through a backend-issued pre-signed URL.
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/omniflow-media;
      mc mb --ignore-existing myminio/omniflow-backups;
      mc anonymous set none myminio/omniflow-media;
      mc anonymous set none myminio/omniflow-backups;
      mc anonymous set download myminio/omniflow-media/public || echo 'WARN: could not set the public/ prefix policy';
      mc version enable myminio/omniflow-media || true;
      echo 'MinIO bucket policy applied: bucket private, only public/ is anonymously readable.';
      "
    networks:
      - omniflow-prod-net

  # ── Application Plane (Compute & APIs) ──────────────────────────────────────
  fastapi-backend:
    <<: *backend-base
    container_name: prod-fastapi
    command: uvicorn src.gateway.main:create_app --factory --host 0.0.0.0 --port 8000 --workers 4
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Uses the interpreter that is guaranteed to be in the image instead of
      # assuming curl/wget are installed.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  nextjs-frontend:
    build:
      context: ../omniflow-frontend
      dockerfile: Dockerfile
    container_name: prod-nextjs
    restart: always
    logging: *default-logging
    env_file: .env.prod
    depends_on:
      fastapi-backend:
        condition: service_healthy
    networks:
      - omniflow-prod-net
    healthcheck:
      # Node 18+ ships a global fetch(). If your Next.js app exposes a dedicated
      # /api/health route, point the URL at it for a deeper check.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker-router:
    <<: *backend-base
    container_name: prod-worker-router
    command: python -m src.ai_workers.semantic_router.worker
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # These workers expose no HTTP port, so we assert that the expected
      # module is still the process running as PID 1. Reading /proc avoids
      # depending on procps (`pgrep`) being present in the image.
      test: ["CMD-SHELL", "grep -q semantic_router /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker-invoker:
    <<: *backend-base
    container_name: prod-worker-invoker
    command: python -m src.ai_workers.llm_invoker.worker
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q llm_invoker /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker-dispatcher:
    <<: *backend-base
    container_name: prod-worker-dispatcher
    command: python -m src.ai_workers.outbound_dispatcher.worker
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q outbound_dispatcher /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Celery (scheduled + background tasks) ──────────────────────────────────
  # Application code lives in omniflow-backend/src/celery_app.
  # Broker / result backend come from CELERY_BROKER_URL & CELERY_RESULT_BACKEND
  # in .env.prod (Redis logical DBs 3 and 4).
  celery-worker:
    <<: *backend-base
    container_name: prod-celery-worker
    command: celery -A src.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app inspect ping -d celery@$$HOSTNAME > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery-beat:
    <<: *backend-base
    container_name: prod-celery-beat
    command: celery -A src.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      # Beat has no inspect interface — assert the scheduler process is alive.
      test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Ingress (Reverse Proxy) ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: prod-nginx
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      # Bind mounts (previously named volumes) so that certbot can be run
      # straight from the host against ./certbot/{conf,www} — which is exactly
      # what deploy.sh documents.
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      # Deliberately `service_started`, NOT `service_healthy`: the ingress must
      # come up even when an upstream is unhealthy, otherwise a broken backend
      # would also block the Let's Encrypt HTTP-01 challenge (which nginx has to
      # serve) and you could never obtain a certificate. An unhealthy upstream
      # simply yields 502 on that route.
      fastapi-backend:
        condition: service_started
      nextjs-frontend:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - omniflow-prod-net
    healthcheck:
      # busybox wget is always present in nginx:alpine; curl is not.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
