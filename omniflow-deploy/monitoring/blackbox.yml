modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: []          # any 2xx
      method: GET
      preferred_ip_protocol: ip4
  # /health/workers answers 200 even when a worker is down; the body says which. Require all_ok=true.
  http_workers_ok:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"all_ok":\s*true'
  http_tls:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
