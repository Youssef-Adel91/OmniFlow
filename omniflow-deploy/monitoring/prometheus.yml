# ─────────────────────────────────────────────────────────────────────────────
# Prometheus scrape configuration for OmniFlow AI.
# Mounted read-only into the prometheus container by
# docker-compose.monitoring.yml.
#
# Reload without a restart:
#   curl -X POST http://127.0.0.1:9091/-/reload
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: production
    project: omniflow

# Alert rules are loaded from monitoring/rules/. Alertmanager ships with a no-op receiver:
# ⚠️ CLIENT ACTION: define a real receiver in monitoring/alertmanager.yml to actually get notified.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── Prometheus itself ──────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # ── Redis ──────────────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  # ── FastAPI backend ────────────────────────────────────────────────────────
  # The backend enables a Prometheus exporter via OpenTelemetry when
  # PROMETHEUS_ENABLED=true (see omniflow-backend/.env.example); the exporter
  # listens on PROMETHEUS_PORT, which defaults to 9090.
  #
  # ⚠️ CLIENT ACTION: if the backend instead mounts the metrics endpoint on the
  # main API port, swap the target for "fastapi-backend:8000" and set
  # metrics_path to the route it actually uses (commonly /metrics).
  - job_name: fastapi-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi-backend:9090"]
        labels:
          service: fastapi-backend

  # ── Celery / AI workers ────────────────────────────────────────────────────
  # Disabled by default: these processes expose no HTTP metrics port yet.
  # Enable once a prometheus_client start_http_server(9100) (or a Flower
  # exporter) is added to the worker entrypoints.
  # - job_name: celery-worker
  #   static_configs:
  #     - targets: ["celery-worker:9100"]

  # ── Qdrant ─────────────────────────────────────────────────────────────────
  # Qdrant exposes Prometheus metrics on /metrics of its REST port.
  # If QDRANT__SERVICE__API_KEY is set, the scrape needs the api-key header —
  # uncomment the authorization block and store the key in a file.
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          service: qdrant
    # authorization:
    #   type: api-key
    #   credentials_file: /etc/prometheus/qdrant_api_key

  # ── MinIO ──────────────────────────────────────────────────────────────────
  # ⚠️ CLIENT ACTION: MinIO metrics require a bearer token unless
  # MINIO_PROMETHEUS_AUTH_TYPE=public is set on the minio service.
  # - job_name: minio
  #   metrics_path: /minio/v2/metrics/cluster
  #   static_configs:
  #     - targets: ["minio:9000"]

  # ── Host (disk / memory / backup freshness via the textfile collector) ─────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  # ── Black-box probes (from inside the Docker network) ──────────────────────
  - job_name: blackbox-ready
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://fastapi-backend:8000/health/ready"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-workers
    metrics_path: /probe
    params: {module: [http_workers_ok]}
    static_configs:
      - targets: ["http://fastapi-backend:8000/health/workers"]
    relabel_configs: *blackbox_relabel

  # ⚠️ CLIENT ACTION (after DNS + the real certificate exist): replace the domain and uncomment — alerts when the
  # certificate is within 14 days of expiry or the public site is unreachable.
  # - job_name: blackbox-tls
  #   metrics_path: /probe
  #   params: {module: [http_tls]}
  #   static_configs:
  #     - targets: ["https://YOUR_DOMAIN/health"]
  #   relabel_configs: *blackbox_relabel
