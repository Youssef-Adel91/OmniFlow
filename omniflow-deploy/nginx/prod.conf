# ═════════════════════════════════════════════════════════════════════════════
# OmniFlow AI — Production Nginx Ingress
# Mounted at /etc/nginx/conf.d/default.conf  (i.e. this file lives in the
# `http { }` context, so http-level directives such as limit_req_zone are legal
# at the top of this file).
#
# ⚠️ CLIENT ACTION — DOMAIN
#   Every occurrence of the placeholder `SERVER_DOMAIN` below must be replaced
#   with the real domain BEFORE going live:
#       sed -i 's/SERVER_DOMAIN/example.com/g' nginx/prod.conf
#   deploy.sh warns loudly if the placeholder is still present.
#
# ⚠️ CLIENT ACTION — TLS CERTIFICATES
#   The 443 block expects Let's Encrypt files at
#       /etc/letsencrypt/live/SERVER_DOMAIN/fullchain.pem
#       /etc/letsencrypt/live/SERVER_DOMAIN/privkey.pem
#   (host path: ./certbot/conf/live/SERVER_DOMAIN/).
#   deploy.sh generates a SELF-SIGNED placeholder at that exact path when it is
#   missing, so nginx always boots and the ACME HTTP-01 challenge can run.
#   Issue the real certificate with:
#
#     docker run --rm \
#       -v "$(pwd)/certbot/conf:/etc/letsencrypt" \
#       -v "$(pwd)/certbot/www:/var/www/certbot" \
#       certbot/certbot certonly --webroot -w /var/www/certbot \
#       --force-renewal -d SERVER_DOMAIN -d www.SERVER_DOMAIN \
#       --email ops@SERVER_DOMAIN --agree-tos --no-eff-email
#
#   then: docker compose --env-file .env.prod -f docker-compose.prod.yml \
#           exec nginx nginx -s reload
# ═════════════════════════════════════════════════════════════════════════════

# ── WebSocket / SSE upgrade map ──────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limiting zones (http context) ───────────────────────────────────────
# Keyed on the client IP. 10m of shared memory ≈ 160k distinct IPs per zone.
#
#   auth_limit    — login / token / webhook endpoints. Deliberately low: these
#                   are the endpoints worth brute-forcing.
#   api_limit     — general REST API traffic.
#   general_limit — everything else (frontend pages, static assets).
# Query strings can contain SSE tokens or signed object credentials.
log_format omniflow_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log omniflow_safe;
limit_req_zone  $binary_remote_addr zone=auth_limit:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr zone=api_limit:10m     rate=30r/s;
limit_req_zone  $binary_remote_addr zone=general_limit:10m rate=60r/s;

# ── Connection limiting zone ─────────────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Return 429 (not the nginx default 503) so clients can back off correctly.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ── Shared SSL tuning ────────────────────────────────────────────────────────
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# Hide the nginx version banner.
server_tokens off;

# Upload ceiling (media/voice notes go through /api/ and /omniflow-media/).
client_max_body_size 50m;
client_body_timeout  60s;
client_header_timeout 30s;


# ═════════════════════════════════════════════════════════════════════════════
# HTTP :80 — ACME challenge + permanent redirect to HTTPS
# ═════════════════════════════════════════════════════════════════════════════
server {
    listen      80;
    listen      [::]:80;
    server_name SERVER_DOMAIN www.SERVER_DOMAIN;   # <-- REPLACE SERVER_DOMAIN

    # ── Let's Encrypt ACME challenge ─────────────────────────────────────────
    # MUST stay reachable over plain HTTP — it is excluded from the redirect
    # below because it is matched by a more specific location.
    location ^~ /.well-known/acme-challenge/ {
        root    /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Local liveness probe for the nginx container's own healthcheck.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Force HTTPS (301) for everything else ────────────────────────────────
    location / {
        return 301 https://$host$request_uri;
    }
}


# ═════════════════════════════════════════════════════════════════════════════
# HTTPS :443 — the real application ingress
# ═════════════════════════════════════════════════════════════════════════════
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name SERVER_DOMAIN www.SERVER_DOMAIN;   # <-- REPLACE SERVER_DOMAIN

    ssl_certificate     /etc/letsencrypt/live/SERVER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_DOMAIN/privkey.pem;

    # OCSP stapling — enable once a REAL (non self-signed) certificate is in
    # place; it fails harmlessly but noisily with a self-signed placeholder.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/SERVER_DOMAIN/chain.pem;
    # resolver 127.0.0.11 valid=30s;   # docker embedded DNS

    # ── HSTS ─────────────────────────────────────────────────────────────────
    # ⚠️ Only enable `preload` once you are certain every sub-domain will serve
    # valid HTTPS forever — it is effectively irreversible for 2 years.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    include /etc/nginx/snippets/security-headers.conf;

    # ── Global connection cap per client IP ──────────────────────────────────
    limit_conn conn_per_ip 50;

    access_log /var/log/nginx/omniflow.access.log omniflow_safe;
    error_log  /var/log/nginx/omniflow.error.log warn;

    # Compression for text payloads.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── Auth / webhook endpoints — strictest rate limit ──────────────────────
    # 10 r/s sustained, short bursts absorbed without delaying legitimate
    # traffic. Meta/WhatsApp webhook fan-in is bursty, hence the larger burst.
    location ^~ /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_conn conn_per_ip 20;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000;
    }

    location ^~ /api/v1/webhooks/ {
        limit_req zone=auth_limit burst=50 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000;

        # Webhook bodies must reach the app byte-identical for HMAC
        # (X-Hub-Signature-256) verification — never let nginx rewrite them.
        proxy_request_buffering on;
        proxy_read_timeout 30s;
    }

    # ── FastAPI backend (general API) ────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000;

        # Extended timeouts for AI processing (LLM round-trips).
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 75s;
        proxy_buffering       off;   # stream LLM/SSE responses straight through
    }

    # ── Health probe (unauthenticated, unrated — used by uptime monitors) ────
    location = /health {
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000/health;
        access_log off;
    }

    location = /health/ready {
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000/health/ready;
        access_log off;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API documentation — RESTRICTED ───────────────────────────────────────
    # See nginx/snippets/internal-only.conf for the IP allow-list / Basic Auth
    # configuration the client must fill in.
    location /docs {
        include /etc/nginx/snippets/internal-only.conf;
        limit_req zone=auth_limit burst=10 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000/docs;
    }

    location /redoc {
        include /etc/nginx/snippets/internal-only.conf;
        limit_req zone=auth_limit burst=10 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000/redoc;
    }

    location = /openapi.json {
        include /etc/nginx/snippets/internal-only.conf;
        limit_req zone=auth_limit burst=10 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fastapi-backend:8000/openapi.json;
    }

    # ── MinIO media storage ──────────────────────────────────────────────────
    # NOTE: the bucket is no longer world-readable (see minio-init in
    # docker-compose.prod.yml). Only objects under `public/` are anonymously
    # downloadable; everything else must be fetched via a pre-signed URL issued
    # by the backend.
    location /omniflow-media/ {
        limit_req zone=general_limit burst=100 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://minio:9000/omniflow-media/;

        proxy_buffering off;
        add_header Cache-Control "private, no-store";

        # CORS for in-browser media playback.
        # ⚠️ CLIENT ACTION: tighten '*' to https://SERVER_DOMAIN if the media is
        # not meant to be embeddable from arbitrary origins.
        add_header 'Access-Control-Allow-Origin'  '*';
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';

        # Re-declared because this block has its own add_header directives.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── Next.js frontend (catch-all) ─────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=120 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://nextjs-frontend:3000;

        proxy_read_timeout 90s;
    }
}
