# ─────────────────────────────────────────────────────────────────────────────
# "Internal only" access gate — used for /docs, /redoc and /openapi.json.
#
# `satisfy any` => a request is allowed if EITHER
#     (a) it comes from an allow-listed IP,  OR
#     (b) it presents valid HTTP Basic credentials.
# Change to `satisfy all` if you want to require BOTH.
#
# ⚠️ CLIENT ACTION #1 — IP allow-list
#   Uncomment and replace with the real office / VPN / bastion addresses:
#       allow 203.0.113.10;        # office static IP
#       allow 198.51.100.0/24;     # VPN range
#   Leave `deny all;` as the last rule.
#
# ⚠️ CLIENT ACTION #2 — Basic Auth credentials
#   The password file is mounted at /etc/nginx/htpasswd (host: ./nginx/htpasswd).
#   deploy.sh creates an EMPTY placeholder, which means *nobody* can log in
#   (fail-closed, safe default). Create a real user with:
#
#       docker run --rm -it httpd:2.4-alpine \
#         htpasswd -nbB omniflow 'STRONG_PASSWORD_HERE' >> ./nginx/htpasswd
#
#   ...then `docker compose -f docker-compose.prod.yml restart nginx`.
#   (Or, on a host that has apache2-utils: `htpasswd -B ./nginx/htpasswd omniflow`)
# ─────────────────────────────────────────────────────────────────────────────

satisfy any;

# allow 203.0.113.10;          # <-- REPLACE: office / bastion IP
# allow 198.51.100.0/24;       # <-- REPLACE: VPN CIDR
allow 127.0.0.1;               # local loopback only
deny  all;                     # fail-closed default

auth_basic           "OmniFlow Restricted Area";
auth_basic_user_file /etc/nginx/htpasswd;
