# ─────────────────────────────────────────────────────────────────────────────
# Security headers (shared).
#
# NOTE (nginx behaviour): `add_header` directives are NOT inherited into a
# `location` block that declares its own `add_header`. That is why these live in
# a snippet — every location that adds its own headers must ALSO
# `include /etc/nginx/snippets/security-headers.conf;` to keep them.
#
# HSTS is deliberately NOT here: it must only be sent over HTTPS. It is added
# directly inside the 443 server block in prod.conf.
# ─────────────────────────────────────────────────────────────────────────────

add_header X-Frame-Options        "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff"    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# X-XSS-Protection is deprecated and can itself introduce vulnerabilities in
# legacy browsers. It is explicitly disabled rather than removed so that no
# upstream default leaks through.
add_header X-XSS-Protection "0" always;

# ── Content-Security-Policy ──────────────────────────────────────────────────
# Baseline tuned for a Next.js app.
#   - 'unsafe-inline' / 'unsafe-eval' in script-src are required by the Next.js
#     runtime (inline hydration bootstrap) unless you switch to nonce-based CSP.
#   - 'unsafe-inline' in style-src is required by styled-jsx / Tailwind JIT.
#
# ⚠️ CLIENT ACTION: if you use third-party services (Clerk, Stripe, Sentry,
# Google Fonts, analytics ...), add their origins here or auth/pay widgets WILL
# be blocked. Example additions for Clerk:
#     script-src  ... https://*.clerk.accounts.dev https://challenges.cloudflare.com;
#     connect-src ... https://*.clerk.accounts.dev;
#     frame-src   ... https://challenges.cloudflare.com;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

# ── Permissions-Policy ───────────────────────────────────────────────────────
# Deny access to powerful browser features the app does not use.
# If you later add voice-note recording in the browser, relax `microphone`.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
