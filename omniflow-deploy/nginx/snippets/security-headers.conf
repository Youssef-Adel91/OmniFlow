# ─────────────────────────────────────────────────────────────────────────────
# Security headers (shared).
#
# NOTE (nginx behaviour): `add_header` directives are NOT inherited into a
# `location` block that declares its own `add_header`. That is why these live in
# a snippet — every location that adds its own headers must ALSO
# `include /etc/nginx/snippets/security-headers.conf;` to keep them.
#
# HSTS is deliberately NOT here: it must only be sent over HTTPS. It is added
# directly inside the 443 server block in prod.conf.
# ─────────────────────────────────────────────────────────────────────────────

add_header X-Frame-Options        "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff"    always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# X-XSS-Protection is deprecated and can itself introduce vulnerabilities in
# legacy browsers. It is explicitly disabled rather than removed so that no
# upstream default leaks through.
add_header X-XSS-Protection "0" always;

# ── Content-Security-Policy ──────────────────────────────────────────────────
# Baseline tuned for a Next.js app.
#   - 'unsafe-inline' / 'unsafe-eval' in script-src are required by the Next.js
#     runtime (inline hydration bootstrap) unless you switch to nonce-based CSP.
#   - 'unsafe-inline' in style-src is required by styled-jsx / Tailwind JIT.
#
# Third parties this product really uses (all in script-src/frame-src below):
#   * Clerk (sign-in): production = your Clerk FRONTEND-API domain, normally https://clerk.SERVER_DOMAIN;
#     dev instances = *.clerk.accounts.dev; *.clerk.com serves assets/avatars.
#   * Cloudflare Turnstile (Clerk bot protection): challenges.cloudflare.com (script + iframe).
# Without these the sign-in page is blocked in production — this was the baseline's TODO and is now filled in.
# SERVER_DOMAIN is replaced together with prod.conf (deploy.sh prints the sed command for BOTH files).
# Hosted payment pages (Moyasar) are full-page redirects, not frames/scripts, so they need no entry.
# NOT yet verified against a live Clerk session — if a widget misbehaves, the browser console names the blocked origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.SERVER_DOMAIN https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' https://clerk.SERVER_DOMAIN https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

# The app (FastAPI middleware / Next.js headers()) emits the same security headers as defence in depth. Nginx is the single
# authority at the edge, so drop the upstream copies — two differing X-Frame-Options/CSP headers are ambiguous or stricter than
# intended. (HSTS is not hidden: both sides send the identical value. Content-Security-Policy-Report-Only passes through.)
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;

# ── Permissions-Policy ───────────────────────────────────────────────────────
# Deny access to powerful browser features the app does not use.
# If you later add voice-note recording in the browser, relax `microphone`.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
